# Usado só pelo coletar.sh do Diagnóstico 06. Liga o pg_stat_statements e REPETE a configuração do experimento 12
# (max_parallel_workers_per_gather=0): o command daqui substitui o do docker-compose.yml inteiro.
services:
  banco:
    command: ["postgres", "-c", "max_parallel_workers_per_gather=0", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
